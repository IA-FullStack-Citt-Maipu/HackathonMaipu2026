services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathomaipu-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathomaipu-frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: /api/v1
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response) => { if (!response.ok) process.exit(1) })",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  db-local:
    image: postgres:16-alpine
    container_name: hackathomaipu-db-local
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: sige_estacionamientos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sige_estacionamientos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  frontend_node_modules:
